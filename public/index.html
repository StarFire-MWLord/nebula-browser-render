<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Starfire</title>
  <meta name="theme-color" content="#02030a">
  <link rel="stylesheet" href="/style.css?v=stable1">
  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv.config.js"></script>
</head>
<body>
  <div id="loginGate" class="loginGate">
    <form id="loginForm" class="loginCard">
      <div class="loginBrand">STARFIRE</div>
      <div class="loginText">Enter the password to continue.</div>
      <input id="loginPassword" type="password" autocomplete="off" placeholder="Password" autofocus>
      <button type="submit">Enter</button>
      <div id="loginError" class="loginError"></div>
    </form>
  </div>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="shell">
    <header>
      <button id="favoritesBtn" class="iconBtn" title="Favorites">★</button>
      <button id="settingsBtn" class="iconBtn" title="Settings">⚙</button>
    </header>

    <main class="home">
      <div class="brand">STARFIRE</div>
      <div class="tagline">Browse through the stars.</div>
      <form id="proxy-form" class="search">
        <input id="proxy-address" autocomplete="off" autofocus
          placeholder="Search the web or enter a URL">
        <button type="submit">Go</button>
      </form>
      <div id="status" class="status">Starting proxy…</div>
    </main>
  </div>

  <aside id="settingsPanel" class="panel">
    <div class="panelHead"><h2>Settings</h2><button data-close="settingsPanel">×</button></div>
    <label>Theme
      <select id="theme">
        <option value="rainbow">Rainbow</option><option value="blue">Blue</option>
        <option value="purple">Purple</option><option value="cyan">Cyan</option>
        <option value="green">Green</option><option value="red">Red</option>
        <option value="orange">Orange</option><option value="white">White</option>
      </select>
    </label>
    <label>Star color
      <select id="starColor">
        <option value="theme">Match theme</option><option value="white">White</option>
        <option value="blue">Blue</option><option value="purple">Purple</option>
        <option value="cyan">Cyan</option><option value="green">Green</option>
        <option value="red">Red</option><option value="orange">Orange</option>
      </select>
    </label>
    <label class="switchRow"><span>Animation</span><input id="animation" type="checkbox" checked></label>
    <label>Star count <span id="countValue"></span>
      <input id="starCount" type="range" min="20" max="220" step="10" value="100">
    </label>
    <label>Mouse sensitivity <span id="mouseValue"></span>
      <input id="mouseSensitivity" type="range" min="0.1" max="10" step="0.1" value="1.5">
    </label>
    <label>Animation speed <span id="speedValue"></span>
      <input id="animationSpeed" type="range" min="0.1" max="10" step="0.1" value="1.5">
    </label>
    <label>Freeze mode
      <select id="freezeMode">
        <option value="off">Moving stars + mouse</option>
        <option value="mouse">Freeze stars, keep mouse interaction</option>
        <option value="all">Freeze everything</option>
      </select>
    </label>
    <button id="resetSettings" class="wideBtn">Reset settings</button>
  </aside>

  <aside id="favoritesPanel" class="panel">
    <div class="panelHead"><h2>Favorites</h2><button data-close="favoritesPanel">×</button></div>
    <form id="favoriteForm" class="favoriteForm">
      <input id="favoriteName" maxlength="28" placeholder="Name (YouTube)">
      <input id="favoriteUrl" placeholder="URL (youtube.com)">
      <button type="submit" class="wideBtn">Save favorite</button>
    </form>
    <div id="favoritesList" class="favoritesList"></div>
  </aside>

  <script src="/baremux/index.js?v=starfire-4"></script>
  <script type="module" src="/app.js?v=stable1"></script>
</body>
</html>
