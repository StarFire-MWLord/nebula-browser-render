<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset STARFIRE</title>
<body style="margin:0;background:#02030a;color:#fff;font-family:system-ui;display:grid;place-items:center;height:100vh">
<p id="s">Resetting browser proxy state…</p>
<script>
(async()=>{
 const s=document.getElementById("s");
 try{
   for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
   if("caches" in window) for(const n of await caches.keys()) await caches.delete(n);
   localStorage.removeItem("bare-mux-transport");
   sessionStorage.clear();
   s.textContent="Reset complete. Close this tab, then open STARFIRE again.";
 }catch(e){s.textContent="Reset failed: "+e.message}
})();
</script>
