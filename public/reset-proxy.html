<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Starfire Proxy Reset</title>
<body style="margin:0;background:#02030a;color:white;font-family:system-ui;display:grid;place-items:center;height:100vh">
<div style="text-align:center;max-width:520px;padding:24px">
<h2>Resetting STARFIRE proxy…</h2><p id="s">Removing the old service worker and cache.</p>
</div>
<script>
(async()=>{
 const s=document.getElementById("s");
 try{
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
   if("caches" in window){
     const names=await caches.keys();
     await Promise.all(names.map(n=>caches.delete(n)));
   }
   s.textContent="Reset complete. Reloading STARFIRE…";
   setTimeout(()=>location.replace("/?swreset="+Date.now()),700);
 }catch(e){
   s.textContent="Reset failed: "+e.message;
 }
})();
</script>
